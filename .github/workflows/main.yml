name: CI

on:
  push:
    branches: [main, development, release]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

  # Автобамп patch (0.2.0 -> 0.2.1) при push в release.
  # Пропуск, если коммит уже от бота — чтобы не зациклить CI.
  version:
    runs-on: ubuntu-latest
    needs: test
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/release' &&
      !contains(github.event.head_commit.message, 'chore: bump version') &&
      !contains(github.event.head_commit.message, 'docs: auto-update')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch version
        id: bump
        run: |
          python <<'PY'
          import re
          from pathlib import Path

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text(encoding="utf-8")
          match = re.search(r'version = "(\d+)\.(\d+)\.(\d+)"', text)
          if not match:
              raise SystemExit("version not found in pyproject.toml")
          major, minor, patch = map(int, match.groups())
          new = f"{major}.{minor}.{patch + 1}"
          text = re.sub(
              r'version = "\d+\.\d+\.\d+"',
              f'version = "{new}"',
              text,
              count=1,
          )
          pyproject.write_text(text, encoding="utf-8")

          init = Path("src/person/__init__.py")
          init.write_text(
              re.sub(
                  r'__version__ = "\d+\.\d+\.\d+"',
                  f'__version__ = "{new}"',
                  init.read_text(encoding="utf-8"),
              ),
              encoding="utf-8",
          )

          changelog = Path("CHANGELOG.md")
          if changelog.exists():
              body = changelog.read_text(encoding="utf-8")
              if f"## {new}" not in body:
                  body = body.replace(
                      "# Changelog\n",
                      f"# Changelog\n\n## {new}\n- Auto bump patch version\n",
                      1,
                  )
                  changelog.write_text(body, encoding="utf-8")

          print(f"Bumped version to {new}")
          Path.home().joinpath("new_version").write_text(new, encoding="utf-8")
          PY
          echo "version=$(cat ~/new_version)" >> "$GITHUB_OUTPUT"

      - name: Commit, push and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VER="${{ steps.bump.outputs.version }}"
          git add pyproject.toml src/person/__init__.py CHANGELOG.md
          git commit -m "chore: bump version to ${VER}"
          git tag -a "v${VER}" -m "Release v${VER}"
          git push origin HEAD:release
          git push origin "v${VER}"

  docs:
    runs-on: ubuntu-latest
    needs: [test, version]
    if: >
      always() &&
      needs.test.result == 'success' &&
      (needs.version.result == 'success' || needs.version.result == 'skipped') &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/development' ||
       github.ref == 'refs/heads/release')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate documentation
        run: |
          mkdir -p docs
          pdoc -o docs person

      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --staged --quiet || (git commit -m "docs: auto-update documentation" && git push)
